name: Native Rain study (not artistic acceptance)

on:
  push:
    branches: ['arena/4c8ed03c-docuflow']
    paths:
      - 'studio/tools/rain_study.py'
      - '.github/workflows/rain-study.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rain-study-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-study:
    if: github.ref == 'refs/heads/arena/4c8ed03c-docuflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/4c8ed03c-docuflow
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native dependencies from Ubuntu and pinned Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libice6 libgl1
          python -m pip install -r studio/production/blender-requirements.lock
      - name: Acquire exact official Rain source and render original diagnostics
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          timeout 600 python studio/tools/rain_study.py
      - name: Publish actual PNGs and inspection to the same working branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Native asset loading has finished before a write token is exposed.
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studio/reviews/rain-study
          git diff --cached --quiet && exit 0
          git commit -m 'Publish native Rain source inspection and real baseline renders'
          # A concurrent branch update fails safely; never force-push or merge it away.
          git push origin arena/4c8ed03c-docuflow
