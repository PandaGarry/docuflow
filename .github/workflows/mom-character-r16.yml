name: Mom primary head form R16 (face proportions, strand groom and wardrobe; not art approval)
on:
  push:
    branches: ['arena/4c8ed03c-docuflow']
    paths:
      - 'studio/tools/mom_character_r16.py'
      - 'studio/tools/mom_groom_r16.py'
      - 'studio/tools/mom_wardrobe_r16.py'
      - 'studio/tools/mom_face_paint_r14.py'
      - 'studio/tools/mom_face_anatomy_r15.py'
      - 'studio/tools/mom_character_probe_r14.py'
      - 'studio/tools/mom_head_cage.py'
      - 'studio/tools/mom_head_surface_r2.py'
      - 'studio/tools/mom_face_controls.py'
      - 'studio/tools/mom_face_probe.py'
      - 'studio/tools/mom_smile_pose_r3.py'
      - 'studio/authoring/mom-character-r16.json'
      - '.github/workflows/mom-character-r16.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mom-character-r16-${{ github.ref }}
  cancel-in-progress: false
jobs:
  primary-head:
    if: github.ref == 'refs/heads/arena/4c8ed03c-docuflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/4c8ed03c-docuflow
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libice6 libgl1
          python -m pip install -r studio/production/blender-requirements.lock
      - name: Source contracts and cage safety (not art approval)
        env:
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python -m unittest discover -s studio/tests -p 'test_*pipeline*.py' -q
          python -m unittest discover -s studio/tests -p 'test_mom_head_cage.py' -q
          python -m unittest discover -s studio/tests -p 'test_mom_head_surface_r2.py' -q
          python -m unittest discover -s studio/tests -p 'test_mom_form_audit.py' -q
          python -m unittest discover -s studio/tests -p 'test_mom_native_audit_receipts.py' -q
          python -m unittest discover -s studio/tests -p 'test_mom_face_controls.py' -q
          python -m unittest discover -s studio/tests -p 'test_mom_head_r13.py' -q
          python -m unittest discover -s studio/tests -p 'test_mom_character_r16.py' -q
          python studio/tools/production_status.py validate
      - name: Download actual verified R15 baseline
        uses: actions/download-artifact@v4
        with:
          name: mom-character-r15-native-wip
          run-id: 41827110660
          github-token: ${{ github.token }}
          path: .cache/r16-r15-source
      - name: Build original-mesh R16 and real Cycles anatomy/groom/wardrobe frames
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          set +e
          timeout 1000 python studio/tools/mom_character_r16.py > .cache/mom-head-form.log 2>&1
          result=$?
          tail -n 70 .cache/mom-head-form.log
          exit "$result"
      - name: Reopen actual saved groomed and clothed native binary
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python studio/tools/mom_character_r16.py --verify > .cache/mom-r14-reopen.log 2>&1
          tail -n 30 .cache/mom-r14-reopen.log
      - name: Keep bounded failure evidence
        if: failure()
        run: |
          mkdir -p studio/reviews/mom-character-r16
          if [ -f .cache/mom-head-form.log ]; then
            tail -n 100 .cache/mom-head-form.log > studio/reviews/mom-character-r16/native-failure.txt
          else
            echo 'Native worker not started; see preceding checks.' > studio/reviews/mom-character-r16/native-failure.txt
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mom-character-r16-native-wip
          path: |
            .cache/r16/mom-character-r16.blend
            studio/reviews/mom-character-r16/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Publish actual head evidence to the current branch
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studio/reviews/mom-character-r16
          git diff --cached --quiet && exit 0
          git commit -m 'Publish actual primary head rebuild R13, matched clay views and native diagnostics'
          git pull --rebase origin arena/4c8ed03c-docuflow
          git push origin arena/4c8ed03c-docuflow
