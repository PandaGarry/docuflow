name: Mom R10 downloaded-binary verification and controlled portrait light (not art approval)
on:
  push:
    branches: ['arena/4c8ed03c-docuflow']
    paths:
      - 'studio/tools/mom_head_lookdev_r10.py'
      - '.github/workflows/mom-head-lookdev-r10.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mom-head-lookdev-r10-${{ github.ref }}
  cancel-in-progress: false
jobs:
  downloaded-asset:
    if: github.ref == 'refs/heads/arena/4c8ed03c-docuflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/4c8ed03c-docuflow
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libice6 libgl1
          python -m pip install -r studio/production/blender-requirements.lock
      - name: Download actual R9 published binary, not a source rebuild
        uses: actions/download-artifact@v4
        with:
          name: mom-head-form-r9-native-wip
          run-id: 41728933536
          github-token: ${{ github.token }}
          path: .cache/lookdev-r10/r9
      - name: Download actual R10 published binary, not a source rebuild
        uses: actions/download-artifact@v4
        with:
          name: mom-head-form-r10-native-wip
          run-id: 41779442779
          github-token: ${{ github.token }}
          path: .cache/lookdev-r10/r10
      - name: Verify packed asset without original source, then controlled portrait light
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          mkdir -p .cache
          set +e
          timeout 900 python studio/tools/mom_head_lookdev_r10.py > .cache/lookdev.log 2>&1
          result=$?
          tail -n 100 .cache/lookdev.log
          exit "$result"
      - name: Keep bounded failure evidence
        if: failure()
        run: |
          mkdir -p studio/reviews/mom-head-lookdev-r10
          if [ -f .cache/lookdev.log ]; then
            tail -n 100 .cache/lookdev.log > studio/reviews/mom-head-lookdev-r10/native-failure.txt
          else
            echo 'Native worker not started; see preceding checks.' > studio/reviews/mom-head-lookdev-r10/native-failure.txt
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mom-head-lookdev-r10-downloaded-asset-review
          path: |
            studio/reviews/mom-head-lookdev-r10/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Publish actual head evidence to the current branch
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studio/reviews/mom-head-lookdev-r10
          git diff --cached --quiet && exit 0
          git commit -m 'Publish independent downloaded R9/R10 binary checks and controlled portrait light'
          git pull --rebase origin arena/4c8ed03c-docuflow
          git push origin arena/4c8ed03c-docuflow
