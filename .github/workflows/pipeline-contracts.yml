name: Blender pipeline contracts

on:
  pull_request:
    paths:
      - 'studio/pipeline/**'
      - 'studio/schemas/**'
      - 'studio/production/smoke/**'
      - 'studio/production/blender-requirements.lock'
      - 'studio/production/sandbox-native*'
      - 'studio/tools/prepare_blender_native.py'
      - 'studio/tests/test_pipeline.py'
      - 'studio/tests/test_package_pipeline.py'
      - 'studio/tools/build_dad_blockout.py'
      - 'studio/production/dad-preview/**'
      - 'studio/production/dad-rig/**'
      - 'studio/authoring/**'
      - 'studio/tools/build_dad_rig.py'
      - 'studio/tools/build_body_test.py'
      - 'studio/tools/check_dad_rig.py'
      - 'studio/tests/test_rig_pipeline.py'
      - 'studio/tests/test_refinement_pipeline.py'
      - 'studio/production/dad-refined/**'
      - 'studio/tools/build_dad_refined.py'
      - 'studio/tools/build_deformation_test.py'
      - 'studio/tools/check_body_extremes.py'
      - 'studio/tools/render_rig_review.py'
      - '.github/workflows/pipeline-contracts.yml'
  push:
    paths:
      - 'studio/pipeline/**'
      - 'studio/schemas/**'
      - 'studio/production/smoke/**'
      - 'studio/production/blender-requirements.lock'
      - 'studio/production/sandbox-native*'
      - 'studio/tools/prepare_blender_native.py'
      - 'studio/tests/test_pipeline.py'
      - 'studio/tests/test_package_pipeline.py'
      - 'studio/tools/build_dad_blockout.py'
      - 'studio/production/dad-preview/**'
      - 'studio/production/dad-rig/**'
      - 'studio/authoring/**'
      - 'studio/tools/build_dad_rig.py'
      - 'studio/tools/build_body_test.py'
      - 'studio/tools/check_dad_rig.py'
      - 'studio/tests/test_rig_pipeline.py'
      - 'studio/tests/test_refinement_pipeline.py'
      - 'studio/production/dad-refined/**'
      - 'studio/tools/build_dad_refined.py'
      - 'studio/tools/build_deformation_test.py'
      - 'studio/tools/check_body_extremes.py'
      - 'studio/tools/render_rig_review.py'
      - '.github/workflows/pipeline-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: Contract and failure-path tests (not a Blender render)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only the contract validator, not the renderer
        run: python -m pip install jsonschema==4.25.1 psutil==7.0.0
      - name: Test schemas, timebase, integrity and real process guards
        run: python -m unittest discover -s studio/tests -p 'test_*pipeline*.py' -v
