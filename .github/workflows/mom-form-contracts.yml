name: Mom audit evidence contracts (not art approval)
on:
  push:
    paths:
      - 'studio/tools/mom_*review*.py'
      - 'studio/tools/mom_native_form_audit.py'
      - 'studio/tools/mom_head_cage.py'
      - 'studio/tools/mom_face_*.py'
      - 'studio/tools/mom_head_surface_r2.py'
      - 'studio/authoring/mom-head-form-*.json'
      - 'studio/tools/rain*.py'
      - 'studio/tests/test_mom_*.py'
      - 'studio/reviews/mom-form-audit/**'
      - 'studio/reviews/mom-head-form-r*/**'
      - '.github/workflows/mom-form-contracts.yml'
  pull_request:
    paths:
      - 'studio/tools/mom_*review*.py'
      - 'studio/tools/mom_native_form_audit.py'
      - 'studio/tools/mom_head_cage.py'
      - 'studio/tools/mom_face_*.py'
      - 'studio/tools/mom_head_surface_r2.py'
      - 'studio/authoring/mom-head-form-*.json'
      - 'studio/tools/rain*.py'
      - 'studio/tests/test_mom_*.py'
      - 'studio/reviews/mom-form-audit/**'
      - 'studio/reviews/mom-head-form-r*/**'
      - '.github/workflows/mom-form-contracts.yml'
permissions:
  contents: read
jobs:
  evidence:
    name: Alignment, public inputs, indexed geometry and frame integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stdlib audit contracts only; no renderer, no private images
        run: |
          python -m unittest discover -s studio/tests -p 'test_mom_form_audit.py' -v
          python -m unittest discover -s studio/tests -p 'test_mom_native_audit_receipts.py' -v
      - name: Install only numpy for the pure cage safety tests
        run: python -m pip install numpy==1.26.4
      - name: Test indexed deformation controls (not anatomy approval)
        run: |
          python -m unittest discover -s studio/tests -p 'test_mom_head_cage.py' -v
          python -m unittest discover -s studio/tests -p 'test_mom_head_surface_r2.py' -v
          python -m unittest discover -s studio/tests -p 'test_mom_head_results.py' -v
          python -m unittest discover -s studio/tests -p 'test_mom_face_controls.py' -v
          python -m unittest discover -s studio/tests -p 'test_mom_face_results.py' -v
          python -m unittest discover -s studio/tests -p 'test_mom_head_r4.py' -v
          python -m unittest discover -s studio/tests -p 'test_mom_head_r4_results.py' -v
          python -m unittest discover -s studio/tests -p 'test_mom_face_finish_r5.py' -v
          python -m unittest discover -s studio/tests -p 'test_mom_face_finish_r6.py' -v
          python -m unittest discover -s studio/tests -p 'test_mom_face_finish_r7.py' -v
          python -m unittest discover -s studio/tests -p 'test_mom_face_paint_r8.py' -v
          python -m unittest discover -s studio/tests -p 'test_mom_color_native_results.py' -v
